name: Apply short organization names to badges

on:
  push:
    paths:
      - '.github/workflows/apply-badge-org-display.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch badge organization source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dashboard/badge-zpl.php')
          s = p.read_text(encoding='utf-8')
          marker = "const BADGE_ORG_PREFIX = '__BADGE_ORG__:';\n"
          include = marker + "\nrequire_once __DIR__ . '/organization-analytics.php';\n"
          if "organization-analytics.php" not in s:
              s = s.replace(marker, include)
          s = s.replace(
              "$organizationSource = (string)$participant['organization'];",
              "$organizationSource = dashboardBadgeOrganizationName((string)$participant['organization']);"
          )
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "rclsmo-site-bot"
          git config user.email "info@rclsmo.ru"
          git add dashboard/badge-zpl.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Print short organization names on badges"
          git push origin main
