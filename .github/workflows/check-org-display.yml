name: Check organization display changes

on:
  push:
    paths:
      - '.github/workflows/check-org-display.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l dashboard/organization-analytics.php
          php -l dashboard/reporting.php
          php -l dashboard/export.php
          php -l dashboard/badge-zpl.php
      - name: JavaScript syntax
        run: node --check dashboard/reporting-client.js
