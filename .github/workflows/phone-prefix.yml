name: Apply phone prefix UX

on:
  push:
    paths:
      - '.github/workflows/phone-prefix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch phone field
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          html_path = Path('registration/index.html')
          html = html_path.read_text(encoding='utf-8')
          html = html.replace(
              '<input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="32" placeholder="+7 (999) 123-45-67" aria-describedby="phoneHint">',
              '<input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="18" value="+7 " placeholder="(999) 123-45-67" aria-describedby="phoneHint">'
          )
          html = html.replace(
              'Российский номер: 10 цифр либо 11 цифр, начиная с +7 или 8.',
              'Введите 10 цифр номера после +7.'
          )
          html = html.replace(
              'js/modules/registration-2026.js?v=20260831-inviteasync1',
              'js/modules/registration-2026.js?v=20260901-phoneprefix1'
          )
          html_path.write_text(html, encoding='utf-8')

          js_path = Path('js/modules/registration-2026.js')
          js = js_path.read_text(encoding='utf-8')

          marker = '''    function formatRussianPhone(normalized) {\n        if (!normalized || normalized.length !== 11) return '';\n        return `+7 (${normalized.slice(1, 4)}) ${normalized.slice(4, 7)}-${normalized.slice(7, 9)}-${normalized.slice(9, 11)}`;\n    }\n'''
          addition = marker + '''\n    function isPhonePrefixOnly(value) {\n        const digits = String(value || '').replace(/\\D+/g, '');\n        return digits === '' || digits === '7';\n    }\n\n    function formatRussianPhoneInput(value) {\n        let digits = String(value || '').replace(/\\D+/g, '');\n        if (!digits || digits === '7') return '+7 ';\n\n        if (digits.length > 11 && (digits.startsWith('77') || digits.startsWith('78'))) {\n            digits = digits.slice(-11);\n        }\n        if (digits.length === 10) digits = `7${digits}`;\n        if (digits.length >= 11 && digits[0] === '8') digits = `7${digits.slice(1)}`;\n        if (digits[0] !== '7') digits = `7${digits}`;\n\n        const subscriber = digits.slice(1, 11);\n        let result = '+7';\n        if (!subscriber.length) return '+7 ';\n        result += ` (${subscriber.slice(0, 3)}`;\n        if (subscriber.length >= 3) result += ')';\n        if (subscriber.length > 3) result += ` ${subscriber.slice(3, 6)}`;\n        if (subscriber.length > 6) result += `-${subscriber.slice(6, 8)}`;\n        if (subscriber.length > 8) result += `-${subscriber.slice(8, 10)}`;\n        return result;\n    }\n'''
          if 'function isPhonePrefixOnly' not in js:
              js = js.replace(marker, addition)

          js = js.replace(
              "        if (phone && phone.value.trim()) {\n            const normalized = normalizeRussianPhone(phone.value);\n            if (!normalized) {\n                setFieldValidity(phone, 'Укажите российский номер: 10 цифр либо 11 цифр, начиная с +7 или 8.');\n            } else {\n                phone.value = formatRussianPhone(normalized);\n            }\n        }",
              "        if (phone && !isPhonePrefixOnly(phone.value)) {\n            const normalized = normalizeRussianPhone(phone.value);\n            if (!normalized) {\n                setFieldValidity(phone, 'Введите 10 цифр номера после +7.');\n            } else {\n                phone.value = formatRussianPhone(normalized);\n            }\n        }"
          )

          js = js.replace(
              "            phone: 'Проверьте телефон: нужен российский номер из 10 цифр либо 11 цифр, начиная с +7 или 8.',",
              "            phone: 'Проверьте телефон: введите 10 цифр номера после +7.',"
          )

          js = js.replace(
              "        const payload = Object.fromEntries(new FormData(form).entries());\n        payload.eventId = config.eventId;",
              "        const payload = Object.fromEntries(new FormData(form).entries());\n        if (payload.phone && isPhonePrefixOnly(payload.phone)) payload.phone = '';\n        payload.eventId = config.eventId;"
          )

          js = js.replace(
              "            form.reset();\n            const code = result.participant_code;",
              "            form.reset();\n            if (form.elements.phone) form.elements.phone.value = '+7 ';\n            const code = result.participant_code;"
          )

          old_wire = '''        if (phone) {\n            phone.addEventListener('blur', () => {\n                setFieldValidity(phone, '');\n                if (!phone.value.trim()) return;\n                const normalized = normalizeRussianPhone(phone.value);\n                if (!normalized) {\n                    setFieldValidity(phone, 'Укажите российский номер: 10 цифр либо 11 цифр, начиная с +7 или 8.');\n                    return;\n                }\n                phone.value = formatRussianPhone(normalized);\n            });\n        }\n'''
          new_wire = '''        if (phone) {\n            phone.value = formatRussianPhoneInput(phone.value);\n\n            phone.addEventListener('focus', () => {\n                if (isPhonePrefixOnly(phone.value)) phone.value = '+7 ';\n                window.setTimeout(() => phone.setSelectionRange(phone.value.length, phone.value.length), 0);\n            });\n\n            phone.addEventListener('input', () => {\n                setFieldValidity(phone, '');\n                phone.value = formatRussianPhoneInput(phone.value);\n                phone.setSelectionRange(phone.value.length, phone.value.length);\n            });\n\n            phone.addEventListener('blur', () => {\n                setFieldValidity(phone, '');\n                if (isPhonePrefixOnly(phone.value)) {\n                    phone.value = '+7 ';\n                    return;\n                }\n                const normalized = normalizeRussianPhone(phone.value);\n                if (!normalized) {\n                    setFieldValidity(phone, 'Введите 10 цифр номера после +7.');\n                    return;\n                }\n                phone.value = formatRussianPhone(normalized);\n            });\n        }\n'''
          js = js.replace(old_wire, new_wire)

          js_path.write_text(js, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "rclsmo-site-bot"
          git config user.email "info@rclsmo.ru"
          git add registration/index.html js/modules/registration-2026.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Keep +7 prefix in registration phone field"
          git push origin main
