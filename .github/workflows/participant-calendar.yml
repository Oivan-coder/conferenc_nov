name: Build participant ticket and calendar

on:
  push:
    paths:
      - '.github/workflows/participant-calendar.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python tools/apply-participant-calendar.py
      - name: Validate PHP syntax
        run: |
          php -l participant.php
          php -l calendar.php
          php -l ticket.php
          php -l api/register.php
          php -l api/qr.php
      - name: Commit changes
        run: |
          git config user.name "Oivan-coder"
          git config user.email "ivangoltsev8@gmail.com"
          git add participant.php calendar.php ticket.php api/qr.php api/register.php js/modules/registration-2026.js
          git commit -m "Add participant ticket and calendar integration"
          git push origin main
