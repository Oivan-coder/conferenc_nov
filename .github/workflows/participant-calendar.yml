name: Build participant ticket and calendar

on:
  push:
    paths:
      - '.github/workflows/participant-calendar.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build participant page and calendar
        shell: python
        run: |
          from pathlib import Path

          participant = r'''<?php
header('Cache-Control: private, no-store, max-age=0');
header('Pragma: no-cache');
header('X-Robots-Tag: noindex, nofollow, noarchive', true);
header('Referrer-Policy: no-referrer');
header('X-Content-Type-Options: nosniff');
header("Content-Security-Policy: frame-ancestors 'none'; base-uri 'self'; form-action 'self'");

const DB_CONFIG_PATH = '/home/c/cx314477/public_html/.private/db.php';

$token = strtolower(trim((string)($_GET['t'] ?? '')));
$participant = null;

if (preg_match('/^[a-f0-9]{64}$/', $token)) {
    try {
        $pdo = require DB_CONFIG_PATH;
        if ($pdo instanceof PDO) {
            $stmt = $pdo->prepare('SELECT participant_code, full_name, position, organization, participation_format, qr_token, online_token FROM participants WHERE registration_status = "confirmed" AND (qr_token = :token OR online_token = :token) LIMIT 1');
            $stmt->execute([':token' => $token]);
            $participant = $stmt->fetch(PDO::FETCH_ASSOC) ?: null;
        }
    } catch (Throwable $e) {
        $participant = null;
    }
}

if (!$participant) http_response_code(404);

function h(?string $value): string {
    return htmlspecialchars((string)$value, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');
}

function googleCalendarUrl(): string {
    $params = [
        'action' => 'TEMPLATE',
        'text' => 'Форум лабораторных инноваций Московской области — 2026',
        'dates' => '20261007T063000Z/20261007T150000Z',
        'details' => 'Форум лабораторных инноваций Московской области. Программа и актуальная информация: https://rclsmo.ru/conference-2026/',
        'location' => 'Дом Правительства Московской области, б-р Строителей, 1, Красногорск, Московская область',
    ];
    return 'https://calendar.google.com/calendar/render?' . http_build_query($params, '', '&', PHP_QUERY_RFC3986);
}

$isOnline = $participant && $participant['participation_format'] === 'online';
$calendarUrl = $participant ? '/calendar.php?t=' . rawurlencode($token) : '#';
$googleUrl = $participant ? googleCalendarUrl() : '#';
$liveUrl = ($participant && $isOnline && !empty($participant['online_token'])) ? '/live/?t=' . rawurlencode((string)$participant['online_token']) : null;
?>
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#07182b">
<title><?= $participant ? 'Мой билет — Форум лабораторных инноваций Московской области — 2026' : 'Билет не найден' ?></title>
<link rel="icon" type="image/png" href="/images/favicon-32x32.png">
<style>
:root{--bg:#061426;--bg2:#0a2037;--card:#0d243b;--line:rgba(106,218,238,.2);--cyan:#66def1;--text:#edf8fb;--muted:#9cb6c5;--white:#fff;--soft:rgba(102,222,241,.08)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 82% 10%,rgba(73,76,202,.18),transparent 34%),radial-gradient(circle at 12% 76%,rgba(37,199,221,.12),transparent 35%),linear-gradient(145deg,var(--bg),#04101e 70%);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{width:min(1100px,calc(100% - 32px));margin:0 auto;padding:34px 0 48px}.brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;margin-bottom:24px}.brand img{width:42px;height:42px;object-fit:contain}.brand strong{font-size:18px;letter-spacing:.08em}.shell{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);background:linear-gradient(145deg,rgba(14,38,61,.96),rgba(6,24,42,.97));border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 28px 90px rgba(0,0,0,.28)}.main{padding:42px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:800}.main h1{margin:12px 0 8px;font-size:clamp(32px,5vw,54px);line-height:1.02}.event{font-size:18px;line-height:1.45;color:#c9dce5;max-width:720px}.person{margin:34px 0 0;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.person strong{display:block;font-size:24px;margin-bottom:7px}.person span{color:var(--muted);line-height:1.5}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.fact{padding:15px;border-radius:15px;background:var(--soft);border:1px solid rgba(102,222,241,.1)}.fact small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}.fact b{font-size:14px;line-height:1.35}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 17px;border-radius:12px;text-decoration:none;font-weight:800;font-size:14px;border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.035)}.btn.primary{background:var(--cyan);color:#042033;border-color:transparent}.btn.live{background:linear-gradient(135deg,#7558df,#29cfe2);border-color:transparent;color:#fff}.calendar{margin-top:26px;padding:20px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid var(--line)}.calendar h2{font-size:17px;margin:0 0 6px}.calendar p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.calendar .actions{margin-top:14px}.side{display:flex;align-items:center;justify-content:center;padding:38px;background:linear-gradient(180deg,rgba(102,222,241,.055),rgba(8,28,47,.55));border-left:1px solid var(--line)}.ticket-box{width:100%;text-align:center}.qr{width:min(320px,100%);aspect-ratio:1;background:#fff;border-radius:22px;padding:10px;display:block;margin:0 auto 18px}.code{font-size:26px;font-weight:900;letter-spacing:.08em;color:var(--cyan)}.hint{color:var(--muted);font-size:13px;line-height:1.5;margin-top:9px}.online-icon{width:190px;height:190px;margin:0 auto 24px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(102,222,241,.25),rgba(117,88,223,.1) 60%,transparent 70%);border:1px solid var(--line);font-size:58px}.privacy{margin:18px auto 0;max-width:330px;color:#6f8c9c;font-size:11px;line-height:1.5}.error{padding:70px 30px;text-align:center}.error h1{font-size:36px;margin:0 0 12px}.error p{color:var(--muted)}@media(max-width:820px){.shell{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--line)}.main{padding:30px}.facts{grid-template-columns:1fr 1fr}.wrap{padding-top:20px}}@media(max-width:520px){.wrap{width:min(100% - 20px,1100px)}.main,.side{padding:22px}.facts{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr}.btn{width:100%}.brand{margin-left:4px}.main h1{font-size:36px}}
</style>
</head>
<body>
<div class="wrap">
<a class="brand" href="/"><img src="/images/favicon-180x180.png" alt=""><strong>РЦЛСМО</strong></a>
<?php if ($participant): ?>
<section class="shell">
<div class="main">
<div class="eyebrow">Персональная страница участника</div>
<h1>Мой билет</h1>
<div class="event">Форум лабораторных инноваций Московской области — 2026</div>
<div class="person"><strong><?= h($participant['full_name']) ?></strong><span><?= h($participant['organization']) ?> · <?= h($participant['position']) ?></span></div>
<div class="facts">
<div class="fact"><small>Дата и время</small><b>7 октября · 09:30–18:00</b></div>
<div class="fact"><small>Место</small><b>Дом Правительства МО</b></div>
<div class="fact"><small>Формат</small><b><?= $isOnline ? 'Онлайн-участие' : 'Очное участие' ?></b></div>
</div>
<div class="actions">
<a class="btn primary" href="/conference-2026/">Программа форума</a>
<?php if ($liveUrl): ?><a class="btn live" href="<?= h($liveUrl) ?>">Открыть трансляцию</a><?php endif; ?>
</div>
<div class="calendar"><h2>Добавить форум в календарь</h2><p>Дата, время и адрес сохранятся автоматически. Персональная ссылка в календарь не передаётся.</p><div class="actions"><a class="btn primary" href="<?= h($calendarUrl) ?>">Apple / Outlook · .ics</a><a class="btn" href="<?= h($googleUrl) ?>" target="_blank" rel="noopener noreferrer">Google Calendar</a></div></div>
</div>
<div class="side"><div class="ticket-box">
<?php if (!$isOnline): ?><img class="qr" src="/api/qr.php?t=<?= h((string)$participant['qr_token']) ?>" alt="QR-код участника"><div class="code"><?= h($participant['participant_code']) ?></div><div class="hint">Покажите QR-код на стойке регистрации.</div>
<?php else: ?><div class="online-icon" aria-hidden="true">▶</div><div class="code"><?= h($participant['participant_code']) ?></div><div class="hint">Ваш онлайн-доступ подтверждён.<br>Кнопка трансляции находится слева.</div><?php endif; ?>
<div class="privacy">Эта страница персональная. Не пересылайте ссылку другим участникам.</div>
</div></div>
</section>
<?php else: ?><section class="shell"><div class="error"><h1>Билет не найден</h1><p>Ссылка недействительна или регистрация была изменена.</p><a class="btn primary" href="/conference-2026/">К странице форума</a></div></section><?php endif; ?>
</div>
</body></html>
'''
          Path('participant.php').write_text(participant, encoding='utf-8')

          calendar = r'''<?php
header('Cache-Control: private, no-store, max-age=0');
header('Pragma: no-cache');
header('X-Robots-Tag: noindex, nofollow, noarchive', true);
header('Referrer-Policy: no-referrer');
header('X-Content-Type-Options: nosniff');

const DB_CONFIG_PATH = '/home/c/cx314477/public_html/.private/db.php';
$token = strtolower(trim((string)($_GET['t'] ?? '')));
$participant = null;

if (preg_match('/^[a-f0-9]{64}$/', $token)) {
    try {
        $pdo = require DB_CONFIG_PATH;
        if ($pdo instanceof PDO) {
            $stmt = $pdo->prepare('SELECT participant_code, full_name, participation_format FROM participants WHERE registration_status = "confirmed" AND (qr_token = :token OR online_token = :token) LIMIT 1');
            $stmt->execute([':token' => $token]);
            $participant = $stmt->fetch(PDO::FETCH_ASSOC) ?: null;
        }
    } catch (Throwable $e) {
        $participant = null;
    }
}

if (!$participant) {
    http_response_code(404);
    header('Content-Type: text/plain; charset=utf-8');
    echo 'Билет не найден';
    exit;
}

function icsEscape(string $value): string {
    return str_replace(["\\", ";", ",", "\r\n", "\n", "\r"], ["\\\\", "\\;", "\\,", "\\n", "\\n", "\\n"], $value);
}

$format = $participant['participation_format'] === 'online' ? 'Онлайн-участие' : 'Очное участие';
$description = 'Форум лабораторных инноваций Московской области — 2026. Формат: ' . $format . '. Программа: https://rclsmo.ru/conference-2026/';
$ics = "BEGIN:VCALENDAR\r\n"
    . "VERSION:2.0\r\n"
    . "PRODID:-//RCLSMO//Forum 2026//RU\r\n"
    . "CALSCALE:GREGORIAN\r\n"
    . "METHOD:PUBLISH\r\n"
    . "BEGIN:VEVENT\r\n"
    . "UID:forum-lab-innovations-2026-10-07@rclsmo.ru\r\n"
    . "DTSTAMP:" . gmdate('Ymd\\THis\\Z') . "\r\n"
    . "DTSTART:20261007T063000Z\r\n"
    . "DTEND:20261007T150000Z\r\n"
    . "SUMMARY:" . icsEscape('Форум лабораторных инноваций Московской области — 2026') . "\r\n"
    . "DESCRIPTION:" . icsEscape($description) . "\r\n"
    . "LOCATION:" . icsEscape('Дом Правительства Московской области, б-р Строителей, 1, Красногорск, Московская область') . "\r\n"
    . "URL:https://rclsmo.ru/conference-2026/\r\n"
    . "STATUS:CONFIRMED\r\n"
    . "BEGIN:VALARM\r\n"
    . "TRIGGER:-P1D\r\n"
    . "ACTION:DISPLAY\r\n"
    . "DESCRIPTION:Форум лабораторных инноваций — завтра\r\n"
    . "END:VALARM\r\n"
    . "END:VEVENT\r\n"
    . "END:VCALENDAR\r\n";

header('Content-Type: text/calendar; charset=utf-8');
header('Content-Disposition: attachment; filename="rclsmo-forum-2026.ics"');
echo $ics;
'''
          Path('calendar.php').write_text(calendar, encoding='utf-8')

          ticket = r'''<?php
header('Cache-Control: private, no-store, max-age=0');
header('Pragma: no-cache');
header('X-Robots-Tag: noindex, nofollow, noarchive', true);
header('Referrer-Policy: no-referrer');
header('X-Content-Type-Options: nosniff');
$token = strtolower(trim((string)($_GET['t'] ?? '')));
if (!preg_match('/^[a-f0-9]{64}$/', $token)) {
    http_response_code(404);
    exit('Билет не найден');
}
header('Location: /participant.php?t=' . rawurlencode($token), true, 302);
exit;
'''
          Path('ticket.php').write_text(ticket, encoding='utf-8')

          qr = Path('api/qr.php')
          qtext = qr.read_text(encoding='utf-8')
          qtext = qtext.replace("$ticketUrl = 'https://rclsmo.ru/ticket.php?t=' . rawurlencode($token);", "$ticketUrl = 'https://rclsmo.ru/participant.php?t=' . rawurlencode($token);")
          qr.write_text(qtext, encoding='utf-8')

          reg = Path('api/register.php')
          text = reg.read_text(encoding='utf-8')
          needle = "function qrImageUrl(string $qrToken): string {\n    return 'https://rclsmo.ru/api/qr.php?t=' . rawurlencode($qrToken);\n}\n"
          insert = needle + "\nfunction participantUrl(string $token): string {\n    return 'https://rclsmo.ru/participant.php?t=' . rawurlencode($token);\n}\n\nfunction calendarUrl(string $token): string {\n    return 'https://rclsmo.ru/calendar.php?t=' . rawurlencode($token);\n}\n"
          if needle not in text:
              raise SystemExit('register helper marker missing')
          text = text.replace(needle, insert, 1)

          text = text.replace("$safeTicketUrl = htmlspecialchars(ticketUrl($qrToken), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');", "$safeTicketUrl = htmlspecialchars(participantUrl($qrToken), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');\n    $safeCalendarUrl = htmlspecialchars(calendarUrl($qrToken), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');", 1)
          text = text.replace(". '<div style=\"text-align:center;margin:24px 0 8px;\"><a href=\"' . $safeTicketUrl . '\" style=\"display:inline-block;background:#214f3b;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:13px 20px;border-radius:9px;\">Открыть билет с QR-кодом</a></div>'", ". '<div style=\"text-align:center;margin:24px 0 8px;\"><a href=\"' . $safeTicketUrl . '\" style=\"display:inline-block;background:#214f3b;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:13px 20px;border-radius:9px;\">Открыть мой билет</a></div>'\n        . '<div style=\"text-align:center;margin:12px 0 8px;\"><a href=\"' . $safeCalendarUrl . '\" style=\"display:inline-block;color:#214f3b;text-decoration:underline;font-size:14px;font-weight:700;\">Добавить форум в календарь</a></div>'", 1)

          text = text.replace("$safeLiveUrl = htmlspecialchars(liveUrl($onlineToken), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');", "$safeLiveUrl = htmlspecialchars(liveUrl($onlineToken), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');\n    $safeParticipantUrl = htmlspecialchars(participantUrl($onlineToken), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');\n    $safeCalendarUrl = htmlspecialchars(calendarUrl($onlineToken), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');", 1)
          online_tail = ". '<p style=\"font-size:13px;line-height:1.6;color:#607268;margin:18px 0 0;\">Ссылка персональная. По ней система фиксирует фактическое онлайн-присутствие участника. Не пересылайте её другим людям.</p><p style=\"font-size:13px;line-height:1.6;color:#607268;margin:10px 0 0;\">Трансляция станет доступна на этой странице в день мероприятия.</p>';"
          online_new = ". '<div style=\"text-align:center;margin:12px 0 4px;\"><a href=\"' . $safeParticipantUrl . '\" style=\"display:inline-block;color:#214f3b;text-decoration:underline;font-size:14px;font-weight:700;margin-right:12px;\">Мой билет</a><a href=\"' . $safeCalendarUrl . '\" style=\"display:inline-block;color:#214f3b;text-decoration:underline;font-size:14px;font-weight:700;\">Добавить в календарь</a></div>'\n        . '<p style=\"font-size:13px;line-height:1.6;color:#607268;margin:18px 0 0;\">Ссылка персональная. По ней система фиксирует фактическое онлайн-присутствие участника. Не пересылайте её другим людям.</p><p style=\"font-size:13px;line-height:1.6;color:#607268;margin:10px 0 0;\">Трансляция станет доступна на этой странице в день мероприятия.</p>';"
          if online_tail not in text:
              raise SystemExit('online email marker missing')
          text = text.replace(online_tail, online_new, 1)

          marker = "    if ($isTestRequest && $registrationStatus === 'confirmed') {\n        if ($format === 'online') $response['live_url'] = liveUrl((string)$onlineToken);\n        else $response['ticket_url'] = ticketUrl($qrToken);\n    }"
          replacement = "    if ($registrationStatus === 'confirmed') {\n        $accessToken = $format === 'online' ? (string)$onlineToken : $qrToken;\n        $response['participant_url'] = participantUrl($accessToken);\n        $response['calendar_url'] = calendarUrl($accessToken);\n        if ($isTestRequest) {\n            if ($format === 'online') $response['live_url'] = liveUrl((string)$onlineToken);\n            else $response['ticket_url'] = participantUrl($qrToken);\n        }\n    }"
          if marker not in text:
              raise SystemExit('response marker missing')
          text = text.replace(marker, replacement, 1)
          reg.write_text(text, encoding='utf-8')

          js = Path('js/modules/registration-2026.js')
          jtext = js.read_text(encoding='utf-8')
          helper_marker = "    function setMessage(element, text, state = '') {\n        if (!element) return;\n        element.textContent = text || '';\n        if (state) element.dataset.state = state;\n        else delete element.dataset.state;\n    }\n"
          helper_insert = helper_marker + "\n    function setMessageAction(element, text, label, url, state = 'success') {\n        setMessage(element, text, state);\n        if (!element || !url) return;\n        const br = document.createElement('br');\n        const link = document.createElement('a');\n        link.href = url;\n        link.textContent = label;\n        link.style.display = 'inline-block';\n        link.style.marginTop = '8px';\n        link.style.fontWeight = '700';\n        element.append(br, link);\n    }\n"
          if helper_marker not in jtext:
              raise SystemExit('JS helper marker missing')
          jtext = jtext.replace(helper_marker, helper_insert, 1)
          jtext = jtext.replace("setMessage(message, `Онлайн-регистрация подтверждена. Код участника: ${code}. Персональная ссылка направлена на почту.`, 'success');", "setMessageAction(message, `Онлайн-регистрация подтверждена. Код участника: ${code}. Персональная ссылка направлена на почту.`, 'Открыть мой билет', result.participant_url, 'success');", 1)
          jtext = jtext.replace("setMessage(message, `Очная регистрация подтверждена. Код участника: ${code}. QR-билет направлен на почту.`, 'success');", "setMessageAction(message, `Очная регистрация подтверждена. Код участника: ${code}. QR-билет направлен на почту.`, 'Открыть мой билет', result.participant_url, 'success');", 1)
          js.write_text(jtext, encoding='utf-8')

      - name: Validate PHP syntax where possible
        run: |
          php -l participant.php
          php -l calendar.php
          php -l ticket.php
          php -l api/register.php
          php -l api/qr.php
      - name: Commit changes
        run: |
          git config user.name "Oivan-coder"
          git config user.email "ivangoltsev8@gmail.com"
          git add participant.php calendar.php ticket.php api/qr.php api/register.php js/modules/registration-2026.js
          git commit -m "Add participant ticket and calendar integration"
          git push origin main
