name: Fix Telegram preview image URL

on:
  push:
    paths:
      - '.github/workflows/fix-telegram-preview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch preview image URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('conference-2026/index.html')
          text = p.read_text(encoding='utf-8')
          old = 'https://rclsmo.ru/images/hero/2026-01-13%2014.19.52.jpg'
          new = 'https://rclsmo.ru/images/og/forum-2026.jpg'
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "rclsmo-site-bot"
          git config user.email "info@rclsmo.ru"
          git add conference-2026/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use clean OG image URL for forum preview"
          git push origin main
